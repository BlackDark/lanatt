# /etc/containers/containers.conf.d/lanatt.conf
# Podman's default hooks_dir is only the package-owned /usr/share/containers/oci/hooks.d.
# This adds the admin directory; rootful and rootless Podman both read it.
[engine]
hooks_dir = [
  "/usr/share/containers/oci/hooks.d",
  "/etc/containers/oci/hooks.d",
]
