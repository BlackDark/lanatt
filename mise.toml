# Repo-local tools. Rust is not here: this repo has no Rust.
[tools]
actionlint = "1.7.12"
go = "1.27.4"
zizmor = "1.33.1"

[tasks.check]
description = "Everything CI checks"
run = """
set -eu
test -z "$(gofmt -l .)"
pkgs=$(go list ./...)
if [ -n "$pkgs" ]; then
  go vet ./...
  go test ./...
fi
"""
