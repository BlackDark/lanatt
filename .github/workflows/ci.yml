# Path-aware code, image, and lint areas with one required `check` gate.
# Draft PRs skip; main, releases, and manual runs execute every area.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.255.2"

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.areas.outputs.go }}
      image: ${{ steps.areas.outputs.image }}
      lint: ${{ steps.areas.outputs.lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: areas
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            { echo "go=true"; echo "image=true"; echo "lint=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths"
          go=false; image=false; lint=false
          while IFS= read -r -d '' path; do
            case "$path" in .github/workflows/ci.yml) go=true; image=true ;; esac
            case "$path" in cmd/* | internal/* | go.mod | go.sum | mise.toml | .config/mise* | mise/* | .mise/* | mise.lock) go=true ;; esac
            case "$path" in Dockerfile | .dockerignore | cmd/* | internal/* | go.mod | go.sum) image=true ;; esac
            case "$path" in .github/* | renovate.json | renovate.json5 | mise.toml | .mise.toml | mise.lock | .mise.lock | .config/mise* | mise/* | .mise/*) lint=true ;; esac
          done < "$RUNNER_TEMP/changed-paths"
          { echo "go=$go"; echo "image=$image"; echo "lint=$lint"; } >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: mise run check

  # Both targets on one runner: Go cross-compiles natively; only the final apt-get runs under QEMU.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - name: Load amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lanatt:ci
          cache-from: type=gha
      - name: Entrypoint runs
        run: |
          out=$(docker run --rm lanatt:ci hook 2>&1 || true)
          grep -q "usage: lanatt hook" <<<"$out"

  actionlint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: actionlint
          cache_save: ${{ github.workflow == 'CI' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: actionlint -color

  renovate-config:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict

  zizmor:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Action allowlist permits mise, not zizmor-action.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: zizmor
      - run: zizmor --format=github .github/workflows

  check:
    if: always()
    needs: [changes, go, image, actionlint, renovate-config, zizmor]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
